<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="DearME — 寬以律己，嚴以待人。個人心情記錄。">
  <title>DearME</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="./" aria-label="DearME 首頁">DearME</a>
      <p class="motto">寬以律己，嚴以待人</p>
      <div class="header-rule" aria-hidden="true"></div>
    </header>

    <section class="journal-heading" aria-label="日記列表">
      <div><p class="eyebrow">A PERSONAL JOURNAL</p><h1>My Journal</h1></div>
      <p class="entry-count"><span id="entry-count">—</span><span> ENTRIES</span></p>
    </section>

    <section class="search-section" aria-label="搜尋文章">
      <label class="search-label" for="search-input">在記憶裡找一找</label>
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="搜尋文字或關鍵字…" autocomplete="off">
        <button id="clear-search" class="clear-search" type="button" aria-label="清除搜尋" hidden>清除</button>
      </div>
    </section>

    <section class="write-panel">
      <button id="toggle-form" class="write-toggle" type="button">＋ 寫下一篇</button>
      <form id="entry-form" hidden>
        <p class="form-date" id="today-date"></p>
        <label for="entry-content">今天想留下什麼？</label>
        <textarea id="entry-content" rows="6" placeholder="把此刻的想法寫下來……" required></textarea>
        <label class="photo-label" for="entry-photo">照片（選填）</label>
        <input id="entry-photo" type="file" accept="image/*">
        <p class="form-hint">送出後會下載文章 JSON 和更新後的 index.json，再一起上傳到 GitHub。</p>
        <div class="form-actions">
          <button class="secondary-button" id="cancel-form" type="button">取消</button>
          <button class="primary-button" type="submit">下載文章資料</button>
        </div>
      </form>
    </section>

    <section id="entries" class="entries" aria-live="polite">
      <p class="status-message">正在整理記錄……</p>
    </section>
    <footer class="site-footer"><span>DearME</span><span>留給自己的文字。</span></footer>
  </main>
</body>
</html>
